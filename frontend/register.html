<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join | Hometown Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

<a class="auth-brand brand" href="index.html">
  <span class="brand-mark">H</span>
  <span>Hometown<span class="brand-accent">Hub</span></span>
</a>

<main class="auth-wrap">

<section class="auth-panel">

  <div class="auth-side">
    <span class="eyebrow">GROW TOGETHER</span>

    <h1>Every hometown has a story.</h1>

    <p>
      Join the people who make yours special.
      Share updates, discover events and reconnect.
    </p>

    <div class="auth-illustration">
      🌳 <span>🏘️</span><span>🤝</span>
    </div>
  </div>

  <form class="auth-form" id="registerForm">

    <span class="eyebrow">GET STARTED</span>
    <h2>Create account</h2>

    <p class="muted">Join your hometown community today.</p>

    <label for="name">Full name</label>
    <input
      id="name"
      name="name"
      type="text"
      placeholder="Your full name"
      required
    >

    <label for="regEmail">Email address</label>
    <input
      id="regEmail"
      name="email"
      type="email"
      placeholder="you@example.com"
      required
    >

    <label for="hometown">Hometown / Village</label>
    <input
      id="hometown"
      name="hometown"
      type="text"
      placeholder="Enter your hometown"
      required
    >

    <label for="regPassword">Password</label>
    <input
      id="regPassword"
      name="password"
      type="password"
      minlength="6"
      placeholder="At least 6 characters"
      required
    >

    <button class="btn btn-primary btn-full" type="submit">
      Create account
    </button>

    <p class="form-message" id="formMessage"></p>

    <p class="auth-switch">
      Already registered?
      <a href="login.html">Log in</a>
    </p>

    <a class="back-link" href="index.html">← Back to home</a>

  </form>

</section>
</main>

<script src="js/app.js"></script>
</body>
</html>
