<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Hometown Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

<a class="auth-brand brand" href="index.html">
  <span class="brand-mark">H</span>
  <span>Hometown<span class="brand-accent">Hub</span></span>
</a>

<main class="auth-wrap">

<section class="auth-panel">

  <div class="auth-side">
    <span class="eyebrow">WELCOME BACK</span>

    <h1>Your community is waiting.</h1>

    <p>
      Sign in to catch up with your hometown,
      neighbours and local events.
    </p>

    <div class="auth-illustration">
      🏡 <span>💬</span><span>🌿</span>
    </div>
  </div>

  <form class="auth-form" id="loginForm">

    <span class="eyebrow">YOUR ACCOUNT</span>
    <h2>Log in</h2>

    <p class="muted">Enter your details to continue.</p>

    <label for="email">Email address</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="you@example.com"
      required
    >

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      placeholder="Enter your password"
      required
    >

    <button class="btn btn-primary btn-full" type="submit">
      Log in
    </button>

    <p class="form-message" id="formMessage"></p>

    <p class="auth-switch">
      New to Hometown Hub?
      <a href="register.html">Create an account</a>
    </p>

    <a class="back-link" href="index.html">← Back to home</a>

  </form>

</section>
</main>

<script src="js/app.js"></script>
</body>
</html
